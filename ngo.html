<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGO Portal - PlateShare</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-box"><ion-icon name="heart"></ion-icon></div>
        <div>Plate<span>Share</span></div>
      </a>

      <button class="menu-btn" id="menu-btn"><ion-icon name="menu-outline"></ion-icon></button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html"><ion-icon name="home-outline"></ion-icon> Home</a></li>
        <li><a href="donor.html"><ion-icon name="add-circle-outline"></ion-icon> Donor Portal</a></li>
        <li><a href="ngo.html" class="active"><ion-icon name="search-outline"></ion-icon> NGO Portal</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">

    <div class="portal-head">
      <div class="icon-box o"><ion-icon name="search-outline"></ion-icon></div>
      <div>
        <h1>NGO Portal</h1>
        <p>Browse available donations and claim what your community needs.</p>
      </div>
    </div>

    <!-- search + filters -->
    <div class="filter-card">
      <div class="filter-top">
        <div class="field">
          <label for="ngo-name">Your NGO name</label>
          <input type="text" id="ngo-name" placeholder="e.g. Hope Community Kitchen">
        </div>

        <div class="field">
          <label for="search-input">Search donations</label>
          <div class="search-box">
            <ion-icon name="search-outline"></ion-icon>
            <input type="text" id="search-input" placeholder="Search by title, donor, or location...">
          </div>
        </div>

        <div class="available-chip">
          <ion-icon name="cube-outline"></ion-icon>
          <span id="available-count">0 available</span>
        </div>
      </div>

      <div class="pills">
        <span class="pills-label"><ion-icon name="options-outline"></ion-icon> FILTER</span>
        <button type="button" class="pill active">All</button>
        <button type="button" class="pill">Prepared Meals</button>
        <button type="button" class="pill">Produce</button>
        <button type="button" class="pill">Bakery</button>
        <button type="button" class="pill">Dairy</button>
        <button type="button" class="pill">Pantry</button>
        <button type="button" class="pill">Beverages</button>
      </div>
    </div>

    <h2 class="results-heading">Available now</h2>
    <div class="cards" id="donation-list"></div>

    <div style="height: 60px"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script src="ngo.js"></script>
</body>
</html>
