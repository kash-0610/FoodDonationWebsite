        <div class="form-container">
            <div class="form-header">
                <h1 class="main-title">
                    <span class="plus-icon"><svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
fill="currentColor" viewBox="0 0 24 24" >
<!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
<path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4z"></path><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10 10-4.49 10-10S17.51 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8"></path>
</svg></span> Donor Portal
                </h1>
                <p class="subtitle">Post surplus food so local NGOs can 
                    claim it before it expires.</p>

            </div>

            <div class="form-card">
                <h2 class="section-title">New food listing</h2>
                <p class="required-notice">Fields marked with 
                    <span class="asterisk">*</span>are required.
                </p>

                <form id="listing-form">
                    <div class="input-group">
                        <label for="title">Listing title <span class="asterisk">*</span></label>
                        <input type="text" id="title" placeholder="e.g. Vegetable curry trays" required>

                    </div>

                    <div class="input-group">
                        <label for="description">Description<span class="asterisk">*</span></label>
                        <textarea id="description" rows="3" placeholder="What is it, where did it come from, any handling notes?" required></textarea>

                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="category">Category<span class="asterisk">*</span></label>
                            <select id="category" required>
                                <option value="prepaid">Prepared Meals</option>
                                <option value="bakery">Produce</option>
                                <option value="Produce">Dairy</option>
                                <option value="bakery">Bakery</option>
                                <option value="bakery">Pantry</option>
                                <option value="bakery">Beverages</option>



                            </select>
                        
                        </div>

                        <div class="input-group">
                            <label for="quantity">Quantity<span class="asterisk">*</span></label>
                            <input type="text" id="quantity" placeholder="e.g. 60 servings" required>

                        </div>
                     </div>

                     <div class="form-row">
                        <div class="input-group">
                            <label for="donor-name">Donor name<span class="asterisk">*</span></label>
                            <input type="text" id="donor-name" placeholder="e.g. Green Leaf Catering" required>
                        </div>
                        <div class="input-group">
                            <label for="location">Pickup location<span class="asterisk">*</span></label>
                            <input type="text" id="location" placeholder="e.g. Downtown Community Center" required>
                        </div>
                     </div>

                     <div class="input-group">
                        <label for="pickup-time">Pickup by<span class="asterisk">*</span></label>
                        <input type="datetime-local" id="pickup-time" required>
                        <span class="input-hint">The food must be collected before this time.</span>
                     </div>


                     <button type="submit" class="submit-btn">
                        <span class="plus-icon">+</span>Publish listing
                     </button>
                
                </form>

            </div>
        </div>
