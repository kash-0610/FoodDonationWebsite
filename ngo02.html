        <div class="ngo-container">

            <div class="ngo-header">
                <h1 class="portal-title">

                <p class="portal-subtitle">Browse available donations and claim what your community needs.</p>

                    <label for="ngo-name">Your NGO name</label>
                    <input type="text" id="ngo-name" placeholder="e.g. Hope Community Kitchen">

                </div>


                <div class="filter-group search-wrapper">
                    <label for="search input">Search donations</label>
                    <div class="search-box-container">
                        <span class="search-inner-icon"><svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
fill="currentColor" viewBox="0 0 24 24" >

</svg></span>
                         <input type="text" id="search-input" placeholder="Search by title, donor, or location...">

                    </div>
                </div>


                <div class="categories-wrapper">
                    <div class="filter-label-text">

                        <button type="button" class="pill-btn">Prepared Meals</button>
                        <button type="button" class="pill-btn">Produce</button>
                        <button type="button" class="pill-btn">Bakery</button>
                        <button type="button" class="pill-btn">Dairy</button>
