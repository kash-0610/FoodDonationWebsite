<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donor Portal - PlateShare</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-box"><ion-icon name="heart"></ion-icon></div>
        <div>Plate<span>Share</span></div>
      </a>

      <button class="menu-btn" id="menu-btn"><ion-icon name="menu-outline"></ion-icon></button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html"><ion-icon name="home-outline"></ion-icon> Home</a></li>
        <li><a href="donor.html" class="active"><ion-icon name="add-circle-outline"></ion-icon> Donor Portal</a></li>
        <li><a href="ngo.html"><ion-icon name="search-outline"></ion-icon> NGO Portal</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">

    <div class="portal-head">
      <div class="icon-box g"><ion-icon name="add-circle-outline"></ion-icon></div>
      <div>
        <h1>Donor Portal</h1>
        <p>Post surplus food so local NGOs can claim it before it expires.</p>
      </div>
    </div>

    <div class="donor-layout">

      <!-- form on the left -->
      <div class="form-card">
        <h2>New food listing</h2>
        <p class="req-note">Fields marked with <span class="star">*</span> are required.</p>

        <form id="listing-form">
          <div class="field">
            <label for="title">Listing title <span class="star">*</span></label>
            <input type="text" id="title" placeholder="e.g. Vegetable curry trays" required>
          </div>

          <div class="field">
            <label for="description">Description <span class="star">*</span></label>
            <textarea id="description" rows="3" placeholder="What is it, where did it come from, any handling notes?" required></textarea>
          </div>

          <div class="row">
            <div class="field">
              <label for="category">Category <span class="star">*</span></label>
              <select id="category" required>
                <option value="Prepared Meals">Prepared Meals</option>
                <option value="Produce">Produce</option>
                <option value="Bakery">Bakery</option>
                <option value="Dairy">Dairy</option>
                <option value="Pantry">Pantry</option>
                <option value="Beverages">Beverages</option>
              </select>
            </div>
            <div class="field">
              <label for="quantity">Quantity <span class="star">*</span></label>
              <input type="text" id="quantity" placeholder="e.g. 60 servings" required>
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="donor-name">Donor name <span class="star">*</span></label>
              <input type="text" id="donor-name" placeholder="e.g. Green Leaf Catering" required>
            </div>
            <div class="field">
              <label for="location">Pickup location <span class="star">*</span></label>
              <input type="text" id="location" placeholder="e.g. Downtown Community Center" required>
            </div>
          </div>

          <div class="field">
            <label for="pickup-time">Pickup by <span class="star">*</span></label>
            <input type="datetime-local" id="pickup-time" required>
            <span class="hint">The food must be collected before this time.</span>
          </div>

          <button type="submit" class="btn btn-green submit-btn">
            <ion-icon name="add-circle-outline"></ion-icon> Publish listing
          </button>
        </form>
      </div>

      <!-- your listings on the right -->
      <div>
        <div class="list-head">
          <h2>Your listings</h2>
          <span class="count-chip" id="total-chip">0 total</span>
        </div>
        <div class="cards" id="my-listings"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script src="donor.js"></script>
</body>
</html>
